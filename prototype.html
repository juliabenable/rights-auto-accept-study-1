<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant Yes Prototype</title>
<!--
SPEC
PURPOSE   The creator side of a brand's rights offer, in the Brand Collabs app chrome.
          Two paths, Airbnb style: (1) the offer comes to Emery as a request with a 48h
          window (yes / ask for more / no), (2) Emery has said yes in advance and an offer
          that meets her settings is accepted at once; she is told after.
SCOPE     Lock-screen push, offer screen, ask for more, yes + in-context opt-in, the
          standing-yes settings, the auto-yes receipt, the Collab Preferences row, the v0
          text thread (Katie's team, zero engineering).
DATA      Demo calendar: Emery posted Nov 25, rights end Feb 23 (Simple, 90 days). Offer
          lands Tue Feb 16, 6:12 pm, 48h window to Thu Feb 18, 6 pm. 90 more days follow
          on from Feb 23 to May 24. Prices from the decided brand ladder (Oct 6):
          organic + paid 75 / 150 / 200, organic only 50 / 100 / 150.
STATUS    Everything on the creator side is PROPOSED (Claude, Oct 20 2026). The brand
          side it plugs into is AGREED (Rights tab handoff, Oct 7).
PARAMS    ?s=<scenario> &screen=<id> &embed=1
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wdth,wght@75,800&display=swap" rel="stylesheet">
<style>
:root{
  /* Benable mobile tokens (Design-Labs / tamagui), lifted from creator-rights-onboarding/flow.html */
  --n1:#1C1C1C; --n3:#555555; --n4:#717171; --n5:#A5A5A5; --n7:#D4D4D4; --n8:#E3E3E3;
  --n9:#F1F1F1; --n9b:#F5F5F5; --n10:#FFFFFF;
  --accent:#7A5CFA; --accent-weak:#F5F3FF; --accent-disabled-bg:#EDEAF9; --accent-disabled-text:#BFB9D2;
  --green:#12804A; --green-weak:#E8F5EE; --amber:#B45309; --amber-weak:#FFF5E6;
  --ground:#E9EAEE; --rail-bg:#16181D; --rail-text:#F5F6F8; --rail-muted:#9AA0AB; --rail-active:#7A5CFA;
  --shadow-card:0 4px 32px rgba(0,0,0,.04);
  --shadow-footer:0 -4px 12px rgba(0,0,0,.06);

  --text:var(--n1); --text-medium:var(--n4); --text-subtle:var(--n5); --text-strong:var(--n3);
  --surface:var(--n10); --surface-weak:var(--n9); --input-bg:var(--n9b);
  --border:var(--n8); --radio-border:var(--n7); --primary:var(--accent); --primary-tint:var(--accent-weak);

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:48px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-hero:'Archivo','Archivo Narrow','Arial Narrow',var(--font);
  --r-8:8px; --r-12:12px; --r-16:16px; --r-full:999px;
  --phone-w:375px; --phone-h:812px; --status-h:54px; --header-h:48px; --button-h:48px; --home-h:34px;
  --t-fast:120ms; --t-med:200ms;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--text);background:var(--ground);-webkit-font-smoothing:antialiased;min-height:100dvh}
img,svg{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
:focus:not(:focus-visible){outline:none}

/* stage: phone + notes side by side */
.stage{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;gap:32px;padding:32px 16px 48px}
body.is-embed{background:var(--surface)}
body.is-embed .stage{padding:0;min-height:0;justify-content:flex-start;align-items:flex-start;gap:0}
body.is-embed .side{display:none}

.phone{width:var(--phone-w);height:var(--phone-h);background:var(--surface);position:relative;overflow:hidden;flex-shrink:0;
       box-shadow:0 1px 2px rgba(16,24,40,.05),inset 0 0 0 1px var(--border)}
body.is-embed .phone{box-shadow:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--surface)}
.screen.is-active{display:flex}

.status{height:var(--status-h);display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px 32px;flex-shrink:0}
.status-time{font-size:17px;font-weight:600;letter-spacing:-.01em}
.status-glyphs{display:inline-flex;align-items:center;gap:6px}
.header{height:var(--header-h);position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-bottom:.5px solid transparent}
.header-title{font-size:14px;font-weight:600}
.header.is-big .header-title{font-size:17px}
.back{position:absolute;left:12px;top:0;height:var(--header-h);width:44px;display:inline-flex;align-items:center;padding-left:4px;border-radius:var(--r-8)}
.close{position:absolute;right:12px;top:0;height:var(--header-h);width:44px;display:inline-flex;align-items:center;justify-content:flex-end;padding-right:4px;border-radius:var(--r-8)}

.body{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:20px}
.hero{font-family:var(--font-hero);font-weight:800;font-stretch:75%;font-size:32px;line-height:36px;letter-spacing:-.5px;text-transform:uppercase;color:var(--text-medium);text-wrap:balance}
.help{color:var(--text-medium)}
.q{font-weight:600}
.stack-8{display:flex;flex-direction:column;gap:8px}

/* brand line */
.brandline{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:var(--r-full);background:#F3E7DA;color:#8A4B1F;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.brandline-text{display:flex;flex-direction:column;min-width:0}
.brandline-name{font-weight:600}
.brandline-sub{color:var(--text-medium);font-size:13px}

/* videos */
.vids{display:flex;gap:8px}
.vid{width:72px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.vid img{width:72px;height:112px;object-fit:cover;border-radius:var(--r-8);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.vid span{font-size:12px;color:var(--text-medium);line-height:16px}

/* inset group (RadioSelectCard surface) */
.card{background:var(--surface);border-radius:var(--r-16);padding:4px 16px;box-shadow:var(--shadow-card),inset 0 0 0 .5px var(--border)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:.5px solid var(--border);min-height:44px}
.row:last-child{border-bottom:none}
.row-label{color:var(--text-medium);width:96px;flex-shrink:0}
.row-value{flex:1;min-width:0;font-weight:500}
.row-value small{display:block;font-weight:400;color:var(--text-medium);font-size:13px;line-height:18px;margin-top:2px}

.money{display:flex;align-items:baseline;gap:8px}
.money-amt{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.money-sub{color:var(--text-medium)}

.timer{display:flex;align-items:center;gap:8px;color:var(--text-medium)}
.timer svg{flex-shrink:0}
.timer.is-soon{color:var(--amber)}

.info{display:flex;gap:8px;align-items:flex-start;background:var(--surface-weak);border-radius:var(--r-12);padding:12px 16px;box-shadow:inset 0 0 0 .5px var(--border);color:var(--text-medium)}
.info svg{flex-shrink:0;margin-top:2px;color:var(--text-strong)}
.info p{flex:1;min-width:0}
.info.is-accent{background:var(--primary-tint);color:var(--text-strong);box-shadow:none}
.info.is-accent svg{color:var(--primary)}

/* footer + buttons (BButton brand 48px, r12) */
.footer{flex-shrink:0;background:var(--surface);padding:16px 16px var(--home-h);box-shadow:var(--shadow-footer);position:relative;display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:var(--button-h);border-radius:var(--r-12);background:var(--primary);color:#fff;font-size:16px;font-weight:600;white-space:nowrap;transition:opacity var(--t-fast)}
.btn:active{opacity:.85}
.btn[disabled]{background:var(--accent-disabled-bg);color:var(--accent-disabled-text);cursor:not-allowed}
.btn.is-ghost{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.btn-pair{display:flex;gap:8px}
.btn-pair .btn{flex:1}
.linkbtn{color:var(--primary);font-weight:600;text-align:left;padding:4px 0;border-radius:6px}
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text)}

/* done screens */
.done{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:8px}
.check{width:48px;height:48px;border-radius:var(--r-full);background:var(--green-weak);color:var(--green);display:inline-flex;align-items:center;justify-content:center}
.done h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.done p{color:var(--text-medium)}

/* opt-in card */
.optin{border-radius:var(--r-16);padding:16px;background:var(--surface);box-shadow:var(--shadow-card),inset 0 0 0 1px var(--primary);display:flex;flex-direction:column;gap:12px}
.optin-head{display:flex;align-items:center;gap:8px;font-weight:600}
.optin-head svg{color:var(--primary)}
.optin p{color:var(--text-medium)}

/* settings */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.toggle-row .t-label{font-weight:600}
.toggle-row .t-sub{color:var(--text-medium);font-size:13px;line-height:18px;margin-top:2px}
.switch{position:relative;width:51px;height:31px;border-radius:var(--r-full);background:var(--n7);flex-shrink:0;transition:background var(--t-med)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform var(--t-med)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.sect{display:flex;flex-direction:column;gap:8px}
.sect-title{font-size:13px;font-weight:600;color:var(--text-medium);padding-left:4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:.5px solid var(--border);min-height:48px}
.opt:last-child{border-bottom:none}
.box{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--radio-border);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--t-fast),box-shadow var(--t-fast)}
.box svg{opacity:0}
.opt[aria-checked="true"] .box{background:var(--text);box-shadow:inset 0 0 0 1.5px var(--text)}
.opt[aria-checked="true"] .box svg{opacity:1}
.radio{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--radio-border);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.radio svg{opacity:0}
.opt[aria-checked="true"] .radio{background:var(--text);box-shadow:inset 0 0 0 1.5px var(--text)}
.opt[aria-checked="true"] .radio svg{opacity:1}
.opt-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt-label{font-weight:600}
.opt-sub{color:var(--text-medium);font-size:13px;line-height:18px}
.opt-price{color:var(--text-medium);font-variant-numeric:tabular-nums;white-space:nowrap}
.is-off .opt, .is-off .sect-title{opacity:.4;pointer-events:none}

.ladder{display:grid;grid-template-columns:1fr auto auto;gap:0;padding:4px 0 12px 36px;font-size:13px;line-height:18px;font-variant-numeric:tabular-nums}
.ladder > *{padding:6px 0;border-bottom:.5px solid var(--border)}
.ladder > .lh{color:var(--text-subtle);font-weight:500}
.ladder .num{text-align:right;padding-left:16px}
.ladder input{width:64px;text-align:right;background:var(--input-bg);border:1px solid var(--n7);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums;font-size:13px}
.ladder input:focus-visible{outline:none;border-color:var(--text)}
.ladder .muted{color:var(--text-subtle)}

/* amount field */
.amount{display:flex;align-items:center;gap:4px;background:var(--input-bg);border:1px solid var(--text);border-radius:var(--r-8);padding:0 12px;height:52px}
.amount span{color:var(--text-medium);font-weight:500;font-size:18px}
.amount input{flex:1;min-width:0;background:transparent;border:none;height:100%;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.amount input:focus-visible{outline:none}
.amount:focus-within{box-shadow:0 0 0 3px var(--primary-tint)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{height:32px;padding:0 12px;border-radius:var(--r-full);box-shadow:inset 0 0 0 1px var(--border);font-weight:500;font-variant-numeric:tabular-nums}
.pchip.is-on{box-shadow:inset 0 0 0 1.5px var(--text)}

/* hub */
.menu{display:flex;flex-direction:column}
.menu-row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 0;width:100%;text-align:left}
.menu-title{font-size:16px;font-weight:600;line-height:24px;white-space:nowrap}
.menu-right{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:20px}
.menu-secondary{flex:1;min-width:0;text-align:right;color:var(--text-medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-row.is-new{box-shadow:inset 0 0 0 1px var(--primary);padding:8px;margin:0 -8px;border-radius:var(--r-8)}

/* lock screen */
.lock{background:radial-gradient(120% 80% at 20% 0%,#5B6B8C 0%,#2B3245 55%,#171A22 100%);color:#fff}
.lock .status{color:#fff}
.lock-time{text-align:center;margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lock-date{font-size:18px;font-weight:500;opacity:.9}
.lock-clock{font-size:84px;line-height:90px;font-weight:600;letter-spacing:-2px}
.notif{margin:auto 10px 120px;background:rgba(245,245,247,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--n1);border-radius:20px;padding:12px 14px;display:flex;gap:10px;text-align:left;width:calc(100% - 20px)}
.notif-icon{width:38px;height:38px;border-radius:9px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-top{display:flex;justify-content:space-between;gap:8px}
.notif-title{font-weight:600;font-size:15px;line-height:20px}
.notif-when{font-size:13px;color:rgba(60,60,67,.6)}
.notif-text{font-size:15px;line-height:20px}
.lock-hint{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:13px;opacity:.7}
.lock .home{background:#fff}

/* messages (v0) */
.msgs{background:#fff}
.msgs-head{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 10px;border-bottom:.5px solid var(--border);flex-shrink:0;position:relative}
.msgs-avatar{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.msgs-name{font-size:12px;color:var(--n1)}
.thread{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:6px}
.stamp{text-align:center;font-size:11px;color:#8E8E93;margin:10px 0 4px}
.b{max-width:78%;padding:8px 12px;border-radius:18px;font-size:15px;line-height:20px}
.b.in{background:#E9E9EB;color:#000;align-self:flex-start;border-bottom-left-radius:6px}
.b.out{background:#0A84FF;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msgs-input{flex-shrink:0;padding:8px 12px var(--home-h);display:flex;gap:8px;align-items:center}
.msgs-input div{flex:1;height:36px;border-radius:18px;box-shadow:inset 0 0 0 1px #D1D1D6;display:flex;align-items:center;padding:0 14px;color:#8E8E93}

.title{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.stays{color:var(--text-medium);display:flex;gap:8px;align-items:flex-start}
.stays svg{flex-shrink:0;margin-top:2px}
.sublabel{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-subtle);padding-top:12px}
.ladder{grid-template-columns:auto repeat(var(--cols),1fr)!important}
/* notes panel (demo explanation, out of the product) */
.side{width:360px;flex-shrink:0;display:flex;flex-direction:column;gap:24px;position:sticky;top:32px}
.notes{display:flex;flex-direction:column;gap:16px}
.notes-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B7080}
.notes h2{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.notes p{color:#3F4350}
.analog{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 0 1px #D9DBE2;display:flex;flex-direction:column;gap:4px}
.analog b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6B7080;font-weight:600}
.prov{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;width:max-content}
.prov.proposed{background:#EEF0FF;color:#3B3FB0}
.prov.agreed{background:#E5F4EC;color:#11663D}
.prov.open{background:#FFF1DC;color:#8A4B00}

/* rail */
.rail{background:var(--rail-bg);color:var(--rail-text);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,560px)}
.rail-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--rail-muted)}
.rail-chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:28px;padding:0 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rail-muted);color:var(--rail-text);font-size:12px;font-weight:500;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.08)}
.chip.is-active{background:var(--rail-active);box-shadow:inset 0 0 0 1px var(--rail-active)}
.rail-state{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:16px;color:var(--rail-muted);white-space:pre-wrap}

@media (max-width:820px){ .stage{flex-direction:column;align-items:center} .side{position:static;width:100%;max-width:375px} }
@media (max-width:420px){ .stage{padding:0 0 40px} .phone{width:100%;max-width:var(--phone-w)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone"></div>
  <div class="side">
    <nav class="rail" aria-label="Demo scenarios">
      <span class="rail-title">Demo · not part of the product</span>
      <div class="rail-chips" id="chips"></div>
      <div class="rail-state" id="railState"></div>
    </nav>
    <aside class="notes" id="notes" aria-live="polite"></aside>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ copy deck
   Creator-facing strings by the copywriter agent, Oct 20 2026 (Copy Desk
   q-20261020-092722-01..42). All PROPOSED. Swap here only. */
const BRAND = 'Simple Skincare';
const COPY = {
  feature: 'Yes in advance',
  featureRow: 'Yes in Advance',                 // Collab Preferences rows are Title Case today
  rowSuggested: 'On, suggested prices',
  rowOwn: 'On, your prices',
  rowSingle: p => `On, $${p} and up`,

  pushOfferTitle: `Offer from ${BRAND}`,

  offerTitle: `${BRAND} wants to keep using your videos`,
  factVideos: 'Videos', factWhere: 'Where', factLong: 'How long',
  videosVal: 'Both videos from this collab',
  whereVal: o => o.type==='paid' ? 'Their pages and ads' : 'Their pages only',
  longVal: o => o.len==='d90' ? '90 more days, until May 24' : o.len==='y1' ? '1 more year, until Feb 23, 2028' : 'No end date',

  stays: 'Your posts stay yours and stay on your page.',
  timer: 'Answer by Thu, 6pm',
  yes: a => `Say yes for $${a}`,
  more: 'Ask for more',

  belowNote: p => `This is below the $${p} you set, so it's your call.`,
  foreverNote: 'You haven\'t said yes in advance to offers with no end date, so it\'s your call.',
  counterTitle: 'Ask for more',
  counterLabel: 'Your price',
  counterHelp: `${BRAND} can say yes or no.`,
  counterSend: a => `Ask for $${a}`,
  counterDoneTitle: `Sent to ${BRAND}`,
  counterDoneText: 'We\'ll let you know when they answer.',
  yesDoneTitle: 'You said yes!',

function floorFor(set, type, len){ return set.price==='own' ? set.own[type][len] : LADDER[type][len]; }
function covers(set, o){
  if(!set.on) return {ok:false, why:'off'};
  if(set.askFirst.includes(BRAND)) return {ok:false, why:'brand'};
  if(o.type==='paid' && !set.paid) return {ok:false, why:'use'};
  if(o.type==='organic' && !set.organic) return {ok:false, why:'use'};
  if(!set[o.len]) return {ok:false, why:'length'};
  const f = floorFor(set, o.type, o.len);
  if(o.amt < f) return {ok:false, why:'price', floor:f};
  return {ok:true, floor:f};
}
function rowValue(){

}

const lockShell = (title, text, to) => `<section class="screen lock" aria-label="Lock screen">${I.status()}
  <div class="lock-time"><span class="lock-date">Tuesday, February 16</span><span class="lock-clock">6:12</span></div>
  <button class="notif" type="button" data-go="${to}"><span class="notif-icon" aria-hidden="true">b</span><span class="notif-body"><span class="notif-top"><span class="notif-title">${title}</span><span class="notif-when">now</span></span><span class="notif-text">${text}</span></span></button>

/* ------------------------------------------------------------------ screens */
const SCREENS = {
  lock: () => lockShell(COPY.pushOfferTitle, COPY.pushOfferText(S.offer), 'offer'),
  lockAuto: () => lockShell(COPY.pushAutoTitle(S.offer), COPY.pushAutoText, 'receipt'),

  offer: () => {
    const o = S.offer, c = covers(S.set, o);
    let note = '';
    if(S.set.on && !c.ok){
      if(c.why==='price') note = `<div class="info is-accent">${I.bolt}<p>${COPY.belowNote(c.floor)}</p></div>`;
      else if(c.why==='length') note = `<div class="info is-accent">${I.bolt}<p>${COPY.foreverNote}</p></div>`;
      else if(c.why==='brand') note = `<div class="info is-accent">${I.bolt}<p>${COPY.brandNote(BRAND)}</p></div>`;
    }
    return `<section class="screen" aria-label="Offer">${I.status()}${header('Offer',{close:'toLock'})}
      <main class="body">
        ${brandline()}
        <h1 class="title">${COPY.offerTitle}</h1>
        ${vids()}
        <div class="card">
          <div class="row"><span class="row-label">${COPY.factVideos}</span><span class="row-value">${COPY.videosVal}</span></div>
          <div class="row"><span class="row-label">${COPY.factWhere}</span><span class="row-value">${COPY.whereVal(o)}</span></div>
          <div class="row"><span class="row-label">${COPY.factLong}</span><span class="row-value">${COPY.longVal(o)}</span></div>
        </div>
        <div class="money"><span class="money-amt">$${o.amt}</span><span class="money-sub">${COPY.moneySub}</span></div>
        <p class="stays">${I.shield}<span>${COPY.stays}</span></p>
        ${note}
        <div class="timer">${I.clock}<span>${COPY.timer}</span></div>
      </main>
      ${footer(`<button class="btn" type="button" data-act="yes">${COPY.yes(o.amt)}</button><div class="btn-pair"><button class="btn is-ghost" type="button" data-act="toCounter">${COPY.more}</button><button class="btn is-ghost" type="button" data-act="no">${COPY.no}</button></div>`)}
    </section>`;
  },

  counter: () => {
    const o = S.offer;
    const sugg = [o.amt+25, o.amt+50, o.amt+75];
    return `<section class="screen" aria-label="${COPY.counterTitle}">${I.status()}${header('Offer',{back:true})}
      <main class="body">
        <h1 class="title">${COPY.counterTitle}</h1>
        <p class="help" style="margin-top:-8px">${BRAND} offered $${o.amt} to keep using your videos ${o.len==='d90'?'for 90 more days':o.len==='y1'?'for 1 more year':'with no end date'}${o.type==='paid'?', ads included':''}.</p>
        <div class="stack-8">
          <label class="q" for="counterAmt">${COPY.counterLabel}</label>
          <div class="amount"><span>$</span><input id="counterAmt" inputmode="numeric" autocomplete="off" value="${S.counter}"></div>
          <div class="chips" role="group" aria-label="Quick amounts">${sugg.map(v=>`<button class="pchip ${v===S.counter?'is-on':''}" type="button" data-amt="${v}">$${v}</button>`).join('')}</div>
        </div>
        <p class="help">${COPY.counterHelp}</p>
      </main>
      ${footer(`<button class="btn" type="button" data-act="sendCounter" ${S.counter>o.amt?'':'disabled'}>${COPY.counterSend(S.counter)}</button>`)}
    </section>`;
  },

  counterDone: () => `<section class="screen" aria-label="Sent">${I.status()}${header('Offer',{close:'toLock'})}
      <main class="body"><div class="done"><span class="check">${I.bigcheck}</span><h2>${COPY.counterDoneTitle}</h2><p>You asked for $${S.counter}. ${COPY.counterDoneText}</p></div></main>
      ${footer(`<button class="btn is-ghost" type="button" data-act="toLock">Done</button>`)}</section>`,

  yesDone: () => {
    const showOptin = !S.set.on;
    return `<section class="screen" aria-label="You said yes">${I.status()}${header('Offer',{close:'toLock'})}
      <main class="body">
        <div class="done"><span class="check">${I.bigcheck}</span><h2>${COPY.yesDoneTitle}</h2><p>${COPY.yesDoneText(S.offer.amt)}</p></div>
        ${showOptin ? `<div class="optin"><span class="optin-head">${I.bolt}${COPY.optinTitle}</span><p>${COPY.optinText(S.offer)}</p>
          <button class="btn" type="button" data-act="optinOn">${COPY.optinOn}</button></div>`
        : `<div class="info is-accent">${I.bolt}<p>${COPY.receiptWhy}</p></div>`}
      </main>
    </section>`;
  },

  noDone: () => `<section class="screen" aria-label="You said no">${I.status()}${header('Offer',{close:'toLock'})}
      <main class="body"><div class="done"><span class="check" style="background:var(--surface-weak);color:var(--text-strong)">${I.bigcheck}</span><h2>${COPY.noDone}</h2><p>${COPY.noDoneText}</p></div></main>
      ${footer(`<button class="btn is-ghost" type="button" data-act="toLock">Done</button>`)}</section>`,

  settings: () => {
    const s = S.set;
    const opt = (key,label,sub,kind='box') => `<button class="opt" type="button" role="${kind==='box'?'checkbox':'radio'}" aria-checked="${kind==='box'? !!s[key] : s.price===key}" data-${kind==='box'?'tog':'price'}="${key}"><span class="${kind}">${I.tick}</span><span class="opt-text"><span class="opt-label">${label}</span>${sub?`<span class="opt-sub">${sub}</span>`:''}</span></button>`;
    const types = [s.organic&&'organic', s.paid&&'paid'].filter(Boolean);
    const lens = ['d90','y1','forever'].filter(l=>s[l]);
    const ladder = (editable) => {
      if(!types.length || !lens.length) return `<div class="ladder" style="--cols:1"><span class="muted">Pick at least one place and one length.</span></div>`;
      let h = `<div class="ladder" style="--cols:${lens.length}" role="table" aria-label="Price per offer"><span class="lh"></span>${lens.map(l=>`<span class="lh num">${LEN_SHORT[l]}</span>`).join('')}`;
      types.forEach(t=>{
        h += `<span>${t==='paid'?COPY.rowAds:COPY.rowPosts}</span>`;
        lens.forEach(l=>{
          h += editable ? `<span class="num"><label style="position:absolute;left:-9999px" for="own-${t}-${l}">${t==='paid'?COPY.rowAds:COPY.rowPosts}, ${LEN_SHORT[l]}</label>$<input id="own-${t}-${l}" inputmode="numeric" data-own="${t}.${l}" value="${s.own[t][l]}"></span>` : `<span class="num">$${LADDER[t][l]}</span>`;
        });
      });
      return h + '</div>';
    };
    return `<section class="screen" aria-label="${COPY.feature}">${I.status()}${header(COPY.feature,{back:true,big:true})}
      <main class="body">
        <p class="help">${COPY.setIntro}</p>
        <div class="card"><div class="toggle-row"><span class="t-label" id="lblOn">${COPY.setToggle}</span><button class="switch" type="button" role="switch" aria-labelledby="lblOn" aria-checked="${s.on}" data-act="toggleOn"></button></div></div>
        <div class="sect ${s.on?'':'is-off'}"><span class="sect-title">${COPY.setWhat}</span>
          <div class="card"><div class="sublabel">${COPY.setWhere}</div>${opt('organic',COPY.optOrganic,COPY.optOrganicSub)}${opt('paid',COPY.optPaid,COPY.optPaidSub)}
            <div class="sublabel">${COPY.setHow}</div>${opt('d90',COPY.len90)}${opt('y1',COPY.len1y)}${opt('forever',COPY.lenForever,COPY.lenForeverSub)}</div></div>
        <div class="sect ${s.on?'':'is-off'}"><span class="sect-title">${COPY.setPrice}</span>
          <div class="card">${opt('suggested',COPY.priceSuggested,'','radio')}${s.price==='suggested'?ladder(false):''}${opt('own',COPY.priceOwn,COPY.priceOwnSub,'radio')}${s.price==='own'?ladder(true):''}</div></div>
        <div class="sect ${s.on?'':'is-off'}"><span class="sect-title">${COPY.setBrands}</span>
          <p class="help" style="font-size:13px;line-height:18px;padding:0 4px">${COPY.setBrandsHelp}</p>
          <div class="card">${MY_BRANDS.map((b,i)=>`<div class="toggle-row" style="border-bottom:${i<MY_BRANDS.length-1?'.5px solid var(--border)':'none'};padding:10px 0"><span class="t-label" id="ab${i}">${b}</span><button class="switch" type="button" role="switch" aria-labelledby="ab${i}" aria-checked="${!s.askFirst.includes(b)}" data-ask="${b}"></button></div>`).join('')}</div></div>
        <p class="help" style="font-size:13px;line-height:18px">${COPY.setFoot}</p>
      </main>
    </section>`;
  },

  receipt: () => {
    const o = S.offer;
    return `<section class="screen" aria-label="${COPY.receiptTitle}">${I.status()}${header('Brand Collabs',{close:'toLock'})}
      <main class="body">
        <div class="done"><span class="check">${I.bigcheck}</span><h2>${COPY.receiptTitle}</h2><p>${COPY.receiptWhat(o)}</p></div>
        ${vids()}
        <div class="card">
          <div class="row"><span class="row-label">${COPY.factWhere}</span><span class="row-value">${COPY.whereVal(o)}</span></div>
          <div class="row"><span class="row-label">${COPY.factLong}</span><span class="row-value">${COPY.longVal(o)}</span></div>
          <div class="row"><span class="row-label">To you</span><span class="row-value" style="font-variant-numeric:tabular-nums">$${o.amt}<small>${COPY.receiptMoneySub}</small></span></div>
        </div>
        <div class="info is-accent">${I.bolt}<p>${COPY.receiptWhy}</p></div>
        <div class="stack-8"><p class="help">${COPY.receiptHelp}</p>
        <button class="linkbtn" type="button" data-go="settings">${COPY.receiptChange}</button></div>
      </main>
    </section>`;
  },

  prefs: () => `<section class="screen" aria-label="Collab Preferences">${I.status()}${header('Collab Preferences',{back:true,big:true})}
      <main class="body" style="gap:0">
        <p class="help" style="margin-bottom:16px">We use this information to properly match you with the right campaigns.</p>
        <div class="menu">
          <button class="menu-row" type="button"><span class="menu-title">Collaboration Type</span><span class="menu-right"><span class="menu-secondary">Open to Both</span>${I.chev}</span></button>
          <button class="menu-row" type="button"><span class="menu-title">Ads With Your Videos</span><span class="menu-right"><span class="menu-secondary">Open, included</span>${I.chev}</span></button>
          <button class="menu-row is-new" type="button" data-go="settings"><span class="menu-title">${COPY.featureRow}</span><span class="menu-right"><span class="menu-secondary">${rowValue()}</span>${I.chev}</span></button>
          <button class="menu-row" type="button"><span class="menu-title">Gifted Campaigns</span><span class="menu-right"><span class="menu-secondary">Very open</span>${I.chev}</span></button>
          <button class="menu-row" type="button"><span class="menu-title">Brand Preferences</span><span class="menu-right"><span class="menu-secondary">Skincare, wellness</span>${I.chev}</span></button>
          <button class="menu-row" type="button"><span class="menu-title">Dream Collabs</span><span class="menu-right"><span class="menu-secondary">Glossier, Kosas</span>${I.chev}</span></button>
        </div>
      </main></section>`,

  sms: () => `<section class="screen msgs" aria-label="Text messages">${I.status()}
      <div class="msgs-head"><span class="back" aria-hidden="true" style="top:4px;color:#0A84FF">${I.back}</span><span class="msgs-avatar" aria-hidden="true">b</span><span class="msgs-name">Benable</span></div>
      <div class="thread" id="thread">${SMS.map(m => m.stamp ? `<span class="stamp">${m.stamp}</span>` : `<div class="b ${m.who}">${m.t}</div>`).join('')}</div>
      <div class="msgs-input"><div>Text Message</div></div><div class="home" aria-hidden="true"></div></section>`
};

/* v0 thread: copywriter SMS (a) and (b), Katie's team from the Benable number */
const SMS = [
  {stamp:'Tue, Feb 16 · 6:12 PM'},
  {who:'in', t:'Hi Emery! Simple Skincare loved your videos and wants to keep using them, ads included, for 90 more days. That\'s $75 to you! Reply by Thu 6pm with YES to accept, ALWAYS to accept this one and any future offer of $75 or more for 90 days, or your price.'},
  {who:'out', t:'ALWAYS'},
  {who:'in', t:'Done! You said yes to Simple Skincare, and you\'re set for next time. Text STOP ALWAYS anytime to go back to being asked.'},
  {stamp:'Mon, Apr 12 · 11:03 AM'},
  {who:'in', t:'Hi Emery! Juniper & Oat offered $75 to keep using your Reel, ads included, for 90 more days. That meets the price you set, so I said yes for you! Nothing to do on your end. If anything\'s not right, reply here.'}
];

/* notes per screen: what happens + the Airbnb analog + status */
const NOTES = {
  lock:   { eyebrow:'Request path', h:'The offer reaches her phone', p:'Katie\'s team relays today. Here the brand\'s offer lands as a push with the price in it, so she knows what it is before she opens it.', analog:'A guest sends a request to book. The host is notified with the dates and the price.', prov:'proposed' },
  lockAuto:{ eyebrow:'Instant path', h:'Told after, not asked', p:'The offer met her settings, so it is already a yes. The push says so, money first.', analog:'Instant Book: the reservation is confirmed and the host is notified. There is no accept step.', prov:'proposed' },
  offer:  { eyebrow:'Request path', h:'One screen, three answers', p:'Who, which videos, where, how long, the money and the clock. Say yes, ask for more, or no. Her posts never change, and the screen says so.', analog:'Request to book: the host accepts, declines, or sends a special offer, within 24 hours.', prov:'proposed' },
  counter:{ eyebrow:'Request path', h:'Ask for more', p:'A counter in one field. The brand side already has Review, Accept and Decline for counter-offers (agreed Oct 6).', analog:'Special offer: the host sends a custom price and the guest decides whether to book.', prov:'proposed' },
  counterDone:{ eyebrow:'Request path', h:'Waiting on the brand', p:'The ball is in the brand\'s court. Nothing she holds changes while she waits.', analog:'The guest gets a window to book at the special offer price.', prov:'proposed' },
  yesDone:{ eyebrow:'The opt-in moment', h:'Offer the standing yes right after a yes', p:'She has just said yes to this exact offer by hand. One tap turns it into her standing yes, prefilled from what she accepted. The close button is the way out; no "Not now" (Tony, Sep 9).', analog:'Airbnb pushes hosts toward Instant Book from the hosting dashboard and listing settings.', prov:'proposed' },
  noDone: { eyebrow:'Request path', h:'A clean no', p:'No reason asked. What the brand already holds stays as it was.', analog:'Declining a request. Airbnb counts answers inside the window in the host\'s response rate.', prov:'proposed' },
  settings:{ eyebrow:'Standing yes', h:'Her conditions, set once', p:'Where, how long, and at what price. No end date starts off. Anything outside her settings still comes to her as a request.', analog:'Instant Book settings with guest requirements: hosts choose who can book without asking.', prov:'proposed' },
  receipt:{ eyebrow:'Instant path', h:'The receipt', p:'What was bought, until when, the money, and why it was a yes. A way to reach Katie\'s team if something feels wrong. Whether she can undo is open.', analog:'Airbnb lets hosts cancel an Instant Book reservation without penalty in limited cases.', prov:'open' },
  prefs:  { eyebrow:'Where it lives', h:'One row in Collab Preferences', p:'Next to the ads answer from onboarding (Sep 10 screen, copy pass Sep 21). The row shows on or off and which prices.', analog:'Instant Book sits in the listing\'s booking settings.', prov:'proposed' },
  sms:    { eyebrow:'v0 · zero engineering', h:'Katie\'s team can run this by text this week', p:'One extra word in the text they already send. ALWAYS goes in a sheet column. Next time an offer meets her price, Katie\'s team says yes for her and texts after.', analog:'The same contract as Instant Book, run by people instead of code.', prov:'proposed' }
};

/* ------------------------------------------------------------------ render */
const phone = document.getElementById('phone');
function render(){
  phone.innerHTML = SCREENS[S.screen]();
  phone.querySelector('.screen').classList.add('is-active');
  const n = NOTES[S.screen];
  document.getElementById('notes').innerHTML = n ? `<span class="notes-eyebrow">${n.eyebrow}</span><h2>${n.h}</h2><p>${n.p}</p>
    <div class="analog"><b>Airbnb analog</b><span>${n.analog}</span></div>
    <span class="prov ${n.prov}">${n.prov==='proposed'?'PROPOSED · Claude, Oct 20':'OPEN · undo rule, Julia + Tony'}</span>` : '';
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('is-active', c.dataset.s===S.scen));
  const s=S.set, c=covers(s,S.offer);
  document.getElementById('railState').textContent =
    `yes_in_advance: ${s.on?'on':'off'} · where: ${[s.organic&&'pages',s.paid&&'ads'].filter(Boolean).join('+')||'none'} · how long: ${['d90','y1','forever'].filter(l=>s[l]).join(',')||'none'} · price: ${s.price}${s.askFirst.length?' · brands off: '+s.askFirst.join(', '):''}\noffer: $${S.offer.amt} ${S.offer.type==='paid'?'pages+ads':'pages'} ${S.offer.len} → ${c.ok?'instant yes':'ask her ('+c.why+')'}`;
  if(S.screen==='sms'){ const t=document.getElementById('thread'); t.scrollTop=t.scrollHeight; }
}
function go(screen){ S.history.push(S.screen); S.screen=screen; render(); }
function startScenario(key){
  const sc = SCENARIOS[key];
  S = { scen:key, screen:sc.start, set:Object.assign(DEFAULT_SET(), sc.set), offer:{...sc.offer}, counter:sc.offer.amt+25, history:[], single:null };
  render();
}

document.getElementById('chips').innerHTML = Object.entries(SCENARIOS).map(([k,v])=>`<button class="chip" type="button" data-s="${k}">${v.label}</button>`).join('');
document.getElementById('chips').addEventListener('click', e=>{ const c=e.target.closest('.chip'); if(c) startScenario(c.dataset.s); });

phone.addEventListener('click', e=>{
  const t = e.target.closest('[data-go],[data-act],[data-tog],[data-price],[data-amt],[data-ask]');
  if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.amt){ S.counter=+t.dataset.amt; render(); return; }
  if(t.dataset.ask){ if(!S.set.on) return; const b=t.dataset.ask, a=S.set.askFirst; S.set.askFirst = a.includes(b) ? a.filter(x=>x!==b) : a.concat(b); render(); return; }
  if(t.dataset.tog){ if(!S.set.on) return; S.set[t.dataset.tog]=!S.set[t.dataset.tog]; S.single=null; render(); return; }
  if(t.dataset.price){ if(!S.set.on) return; S.set.price=t.dataset.price; S.single=null; render(); return; }
  const a = t.dataset.act;
  if(a==='back'){ S.screen = S.history.pop() || SCENARIOS[S.scen].start; render(); }
  else if(a==='toLock'){ startScenario(S.scen); }
  else if(a==='yes'){ go('yesDone'); }
  else if(a==='no'){ go('noDone'); }
  else if(a==='toCounter'){ const c=covers(S.set,S.offer); if(c.why==='price') S.counter=c.floor; go('counter'); }
  else if(a==='sendCounter'){ go('counterDone'); }
  else if(a==='optinOn'){
    // the standing yes starts from the offer she just accepted: same places, same length, her price = this amount
    const o=S.offer;
    S.set = Object.assign(DEFAULT_SET(), { on:true, paid:o.type==='paid', organic:true, d90:o.len==='d90', y1:o.len==='y1', forever:false, price:'own' });
    S.set.own.paid[o.len]=o.amt; S.set.own.organic[o.len]=o.amt; S.single=o.amt;
    go('settings');
  }
  else if(a==='toggleOn'){ S.set.on=!S.set.on; render(); }
});
phone.addEventListener('input', e=>{
  if(e.target.id==='counterAmt'){
    const v = parseInt(e.target.value.replace(/\D/g,''),10)||0; S.counter=v;
    const b = phone.querySelector('[data-act="sendCounter"]'); b.disabled = !(v>S.offer.amt); b.textContent = COPY.counterSend(v);
    phone.querySelectorAll('.pchip').forEach(p=>p.classList.toggle('is-on', +p.dataset.amt===v));
  }
  if(e.target.dataset.own){
    const [t,l]=e.target.dataset.own.split('.'); S.set.own[t][l]=parseInt(e.target.value.replace(/\D/g,''),10)||0; S.single=null;
  }
});

/* params */
const P = new URLSearchParams(window.__PROTO_PARAMS || location.search);   // __PROTO_PARAMS: set when the study page inlines this prototype
if(P.get('embed')==='1') document.body.classList.add('is-embed');
startScenario(SCENARIOS[P.get('s')] ? P.get('s') : 'first');
if(P.get('screen') && SCREENS[P.get('screen')]){ S.screen=P.get('screen'); render(); }
if(P.get('scroll')){ const b=phone.querySelector('.body'); if(b) b.scrollTop=+P.get('scroll'); }   // for study-page frames
</script>
</body>
</html>
